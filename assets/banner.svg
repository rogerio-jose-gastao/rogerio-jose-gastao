<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
    </pattern>

    <!-- Card Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.6)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1000" height="320" rx="12" fill="url(#bg-grad)"/>
  <rect width="1000" height="320" rx="12" fill="url(#grid)"/>

  <!-- Top Decorative Header Bar -->
  <rect x="0" y="0" width="1000" height="40" fill="rgba(15, 23, 42, 0.9)" rx="12 12 0 0"/>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#334155" stroke-width="1"/>

  <!-- OS Window Control Buttons -->
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>

  <!-- System Header Text -->
  <text x="80" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1.5">SYS://ROG1.LABORATORY.OS v4.2.0 [STATUS: ONLINE]</text>
  <text x="960" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" fill="#38bdf8" text-anchor="end" letter-spacing="1">LATENCY: 0.12ms</text>

  <!-- Left Hero Panel -->
  <g transform="translate(40, 70)">
    <!-- Lab Title -->
    <text x="0" y="45" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      ROG1 <tspan fill="url(#accent-cyan)">LABORATORY</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="80" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      Building Intelligent Systems
    </text>

    <!-- Pillar Badges -->
    <g transform="translate(0, 115)">
      <!-- Badge 1: AI -->
      <rect x="0" y="0" width="180" height="34" rx="6" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <text x="32" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Artificial Intelligence</text>

      <!-- Badge 2: Robotics -->
      <rect x="195" y="0" width="125" height="34" rx="6" fill="url(#card-bg)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="213" cy="17" r="4" fill="#818cf8" filter="url(#glow)"/>
      <text x="227" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Robotics</text>

      <!-- Badge 3: Photonic Quantum Computing -->
      <rect x="335" y="0" width="240" height="34" rx="6" fill="url(#card-bg)" stroke="#10b981" stroke-width="1"/>
      <circle cx="353" cy="17" r="4" fill="#10b981" filter="url(#glow)"/>
      <text x="367" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Photonic Quantum Computing</text>

    </g>

    <!-- Terminal Output Line -->
    <text x="0" y="190" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">
      &gt; core.init() --&gt; Neural Networks | Quantum Simulation | Photonic Interconnects
    </text>
  </g>

  <!-- Right Visual Dashboard Card -->
  <g transform="translate(640, 65)">
    <rect width="320" height="225" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 35 L 0 35 Z" fill="rgba(30, 41, 59, 0.8)"/>
    <text x="16" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#cbd5e1">LABORATORY TELEMETRY</text>
    <circle cx="300" cy="18" r="4" fill="#10b981" filter="url(#glow)"/>

    <!-- Telemetry Metrics -->
    <!-- Metric 1: Quantum/Photonic Core -->
    <g transform="translate(20, 55)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">PHOTONIC CORE</text>
      <text x="280" y="12" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="end">99.8% ACC</text>
      <rect x="0" y="20" width="280" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="20" width="240" height="6" rx="3" fill="url(#accent-cyan)"/>
    </g>

    <!-- Metric 2: AI Neural Models -->
    <g transform="translate(20, 105)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">NEURAL SYNAPSE</text>
      <text x="280" y="12" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8" text-anchor="end">ACTIVE</text>
      <rect x="0" y="20" width="280" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="20" width="210" height="6" rx="3" fill="url(#accent-cyan)"/>
    </g>

    <!-- Metric 3: Autonomous Robotics -->
    <g transform="translate(20, 155)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">ROBOTICS ROS2 KERNEL</text>
      <text x="280" y="12" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" text-anchor="end">SYNCHRONIZED</text>
      <rect x="0" y="20" width="280" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="20" width="260" height="6" rx="3" fill="url(#accent-emerald)"/>
    </g>
  </g>

  <!-- Bottom Cyber Decorative Line -->
  <line x1="40" y1="300" x2="960" y2="300" stroke="#1e293b" stroke-width="1"/>
  <rect x="440" y="298" width="120" height="4" rx="2" fill="#38bdf8"/>
</svg>
